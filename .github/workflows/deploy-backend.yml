name: Backend CI & CD Pipeline (GHCR)

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*.*.*'
      - 'v*'
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag de versión manual (ej: v1.0.0 o 1.0.0)'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Test & Typecheck Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: nextg_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ./backend
        run: bun install --frozen-lockfile

      - name: Run TypeScript typecheck
        working-directory: ./backend
        run: bun run typecheck

      - name: Run Database Migrations and Seed
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/nextg_db
        run: |
          bun run migrate
          bun run seed

      - name: Run Test Suite (Security, Integration, Unit)
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/nextg_db
          JWT_SECRET: test-secret-key-for-github-actions-testing-32chars
          NODE_ENV: test
        run: bun test

  build-and-push:
    name: Build & Push Docker Image to GHCR
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME_LOWER=$(echo '${{ github.repository }}-backend' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Read version from backend/package.json
        id: pkg
        run: |
          VERSION=$(node -p "require('./backend/package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}
          tags: |
            # 1. Tags semánticos automáticos si se empuja un Git Tag (ej: git tag v1.0.0 -> 1.0.0, 1.0, 1)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # 2. Versión declarada en backend/package.json (ej: v1.0.0 y 1.0.0)
            type=raw,value=v${{ steps.pkg.outputs.version }}
            type=raw,value=${{ steps.pkg.outputs.version }}
            # 3. Tag manual si se ejecuta con input desde la interfaz de GitHub Actions
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            # 4. latest en main o git release tags
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            # 5. Tag por nombre de rama (main o dev)
            type=ref,event=branch
            # 6. SHA inmutable
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
