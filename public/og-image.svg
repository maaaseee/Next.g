<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d14"/>
      <stop offset="50%" stop-color="#121526"/>
      <stop offset="100%" stop-color="#1e102d"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="150" r="180" fill="#6366f1" opacity="0.25" filter="url(#glow)"/>
  <circle cx="1050" cy="480" r="220" fill="#ec4899" opacity="0.2" filter="url(#glow)"/>

  <!-- Subtle Grid pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Main Content in Safe Zone (Margin >= 100px) -->
  <g transform="translate(100, 100)">
    <!-- Brand Pill -->
    <rect x="0" y="20" width="180" height="40" rx="20" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="1.5"/>
    <text x="90" y="46" fill="#a5b4fc" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="2">GAME HUB</text>

    <!-- Title NEXT.g -->
    <text x="0" y="160" fill="url(#primaryGrad)" font-family="'Space Grotesk', system-ui, sans-serif" font-size="92" font-weight="800" letter-spacing="-2">NEXT.g</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="225" fill="#f8fafc" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="700">Tu Backlog &amp; Ruleta Gamer</text>
    <text x="0" y="275" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="400">
      Organiza tus videojuegos pendientes y deja que el azar elija tu pr&#243;xima aventura.
    </text>

    <!-- Badges / Features -->
    <g transform="translate(0, 330)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="200" height="48" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="100" y="30" fill="#e2e8f0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">&#127919; Ruleta Aleatoria</text>

      <!-- Badge 2 -->
      <rect x="220" y="0" width="200" height="48" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="320" y="30" fill="#e2e8f0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">&#128218; Backlog Colaborativo</text>

      <!-- Badge 3 -->
      <rect x="440" y="0" width="200" height="48" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="540" y="30" fill="#e2e8f0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">&#9889; RAWG Database</text>
    </g>

    <!-- Graphic Roulette & Controller Mockup on Right Side -->
    <g transform="translate(740, 20)">
      <!-- Glow ring -->
      <circle cx="130" cy="180" r="140" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-dasharray="16 8" opacity="0.6"/>
      <circle cx="130" cy="180" r="105" fill="#131728" stroke="#334155" stroke-width="2"/>
      
      <!-- Controller Icon (Stylized) -->
      <path d="M 90 155 C 90 145 98 140 110 140 L 150 140 C 162 140 170 145 170 155 L 175 195 C 178 215 162 225 152 215 L 140 205 L 120 205 L 108 215 C 98 225 82 215 85 195 Z" fill="#6366f1" fill-opacity="0.3" stroke="#a5b4fc" stroke-width="3"/>
      <circle cx="112" cy="170" r="6" fill="#a5b4fc"/>
      <circle cx="148" cy="165" r="4" fill="#ec4899"/>
      <circle cx="155" cy="175" r="4" fill="#f43f5e"/>

      <!-- Center text inside wheel -->
      <text x="130" y="245" fill="#a5b4fc" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">PRESS START</text>
    </g>
  </g>
</svg>
