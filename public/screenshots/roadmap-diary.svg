<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="dGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#191325" />
      <stop offset="100%" stop-color="#0b0811" />
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#dGrad)" />

  <!-- Navbar -->
  <rect x="0" y="0" width="1200" height="60" fill="#181a1f" stroke="#26282e" stroke-width="1" />
  <text x="40" y="38" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="22" letter-spacing="1">NEXT<tspan fill="#a855f7">.g</tspan></text>
  <rect x="180" y="16" width="150" height="28" rx="2" fill="#a855f7" />
  <text x="195" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="12">DIARIO DE SESIONES</text>

  <!-- Big Roadmap Tag on Top Right -->
  <rect x="960" y="16" width="180" height="28" rx="2" fill="#a855f7" fill-opacity="0.25" stroke="#a855f7" stroke-width="1" />
  <text x="975" y="35" fill="#d8b4fe" font-family="monospace" font-weight="bold" font-size="11">🚀 ROADMAP V1.2</text>

  <!-- Left Stats & Streak Widget -->
  <g transform="translate(60, 90)">
    <rect width="320" height="530" rx="2" fill="#1f182c" stroke="#3b2d54" stroke-width="1" />
    <text x="24" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="15">MI RITMO DE JUEGO</text>

    <!-- Monthly Hour Counter -->
    <rect x="24" y="60" width="272" height="90" rx="2" fill="#130e1c" stroke="#2e2242" stroke-width="1" />
    <text x="40" y="90" fill="#9ca3af" font-family="monospace" font-size="11">NOVIEMBRE 2026</text>
    <text x="40" y="130" fill="#a855f7" font-family="system-ui, sans-serif" font-weight="900" font-size="32">42.5 HS</text>
    <text x="160" y="130" fill="#10b981" font-family="monospace" font-weight="bold" font-size="12">+12% vs Oct</text>

    <!-- Streak -->
    <rect x="24" y="170" width="272" height="70" rx="2" fill="#130e1c" stroke="#2e2242" stroke-width="1" />
    <text x="40" y="198" fill="#9ca3af" font-family="monospace" font-size="11">RACHA DE DÍAS ACTIVOS</text>
    <text x="40" y="225" fill="#f59e0b" font-family="system-ui, sans-serif" font-weight="bold" font-size="16">🔥 6 Días Seguidos Jugando</text>

    <!-- Quick Log Button -->
    <rect x="24" y="440" width="272" height="46" rx="2" fill="#a855f7" />
    <text x="160" y="468" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="13">+ REGISTRAR NUEVA SESIÓN</text>
  </g>

  <!-- Right Timeline of Log Entries -->
  <g transform="translate(420, 90)">
    <text x="0" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="18">BITÁCORA CRONOLÓGICA DE PARTIDAS</text>

    <!-- Entry 1 -->
    <g transform="translate(0, 45)">
      <rect width="720" height="120" rx="2" fill="#1f182c" stroke="#3b2d54" stroke-width="1" />
      <image href="https://images.igdb.com/igdb/image/upload/t_cover_big/co4jni.jpg" x="15" y="15" width="60" height="90" preserveAspectRatio="xMidYMid slice" />
      <text x="90" y="38" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="15">Elden Ring — Árbol Hierático de Miquella</text>
      <text x="90" y="60" fill="#a855f7" font-family="monospace" font-weight="bold" font-size="11">10 Noviembre 2026 · 3.5 Horas · PC / Steam</text>
      <text x="90" y="85" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12">"Derroté a Malenia después de optimizar la build. Una de las mejores peleas de la historia."</text>
      <rect x="620" y="15" width="85" height="24" rx="2" fill="#10b981" fill-opacity="0.2" />
      <text x="635" y="31" fill="#10b981" font-family="monospace" font-weight="bold" font-size="10">85% HISTORIA</text>
    </g>

    <!-- Entry 2 -->
    <g transform="translate(0, 185)">
      <rect width="720" height="120" rx="2" fill="#1f182c" stroke="#3b2d54" stroke-width="1" />
      <image href="https://images.igdb.com/igdb/image/upload/t_cover_big/co670h.jpg" x="15" y="15" width="60" height="90" preserveAspectRatio="xMidYMid slice" />
      <text x="90" y="38" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="15">Baldur's Gate 3 — Torres de Alzaluna</text>
      <text x="90" y="60" fill="#a855f7" font-family="monospace" font-weight="bold" font-size="11">9 Noviembre 2026 · 2.0 Horas · PlayStation 5</text>
      <text x="90" y="85" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12">"Resuelto el asedio al campamento goblin con sigilo y barriles explosivos. Decisiones clave."</text>
      <rect x="620" y="15" width="85" height="24" rx="2" fill="#38bdf8" fill-opacity="0.2" />
      <text x="635" y="31" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="10">ACTO II LISTO</text>
    </g>

    <!-- Entry 3 -->
    <g transform="translate(0, 325)">
      <rect width="720" height="120" rx="2" fill="#1f182c" stroke="#3b2d54" stroke-width="1" />
      <image href="https://images.igdb.com/igdb/image/upload/t_cover_big/co1rgi.jpg" x="15" y="15" width="60" height="90" preserveAspectRatio="xMidYMid slice" />
      <text x="90" y="38" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="15">Hollow Knight — Panteón de Hallownest</text>
      <text x="90" y="60" fill="#a855f7" font-family="monospace" font-weight="bold" font-size="11">7 Noviembre 2026 · 1.5 Horas · Nintendo Switch</text>
      <text x="90" y="85" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12">"Práctica de bosses en la Sala de los Dioses. Calentando para la llegada de Silksong."</text>
      <rect x="620" y="15" width="85" height="24" rx="2" fill="#f59e0b" fill-opacity="0.2" />
      <text x="635" y="31" fill="#f59e0b" font-family="monospace" font-weight="bold" font-size="10">112% COMPLETADO</text>
    </g>
  </g>
</svg>
