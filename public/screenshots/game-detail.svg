<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="detailHeroFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#121316" stop-opacity="1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="#121316" />

  <!-- Backdrop Game Art -->
  <image href="https://images.igdb.com/igdb/image/upload/t_1080p/ar1m4h.jpg" width="1200" height="360" preserveAspectRatio="xMidYMid slice" />
  <rect x="0" y="0" width="1200" height="360" fill="url(#detailHeroFade)" />

  <!-- Navbar -->
  <rect x="0" y="0" width="1200" height="60" fill="#181a1f" fill-opacity="0.8" stroke="#26282e" stroke-width="1" />
  <text x="40" y="38" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="22" letter-spacing="1">NEXT<tspan fill="#ec4899">.g</tspan></text>
  <text x="180" y="35" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">← Volver al catálogo</text>

  <!-- Game Poster on Left (Overlapping Banner) -->
  <g transform="translate(60, 160)">
    <rect width="240" height="340" rx="2" fill="#181a1f" stroke="#333742" stroke-width="2" />
    <image href="https://images.igdb.com/igdb/image/upload/t_cover_big/co4jni.jpg" width="240" height="340" preserveAspectRatio="xMidYMid slice" />
    <rect x="0" y="360" width="240" height="44" rx="2" fill="#10b981" />
    <text x="120" y="387" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="12">EN MI BIBLIOTECA: JUGANDO</text>
  </g>

  <!-- Game Metadata on Right -->
  <g transform="translate(340, 220)">
    <!-- Rating badge and year -->
    <rect x="0" y="0" width="85" height="26" rx="2" fill="#000000" fill-opacity="0.8" stroke="#f59e0b" stroke-width="1" />
    <text x="12" y="18" fill="#f59e0b" font-family="system-ui, sans-serif" font-weight="bold" font-size="13">★ 95.5 / 100</text>
    <text x="105" y="18" fill="#9ca3af" font-family="monospace" font-size="12">Lanzamiento: 25 Febrero 2022 · FromSoftware</text>

    <!-- Title -->
    <text x="0" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="36" letter-spacing="-0.5">ELDEN RING</text>

    <!-- Genre & Platform Badges -->
    <g transform="translate(0, 85)">
      <rect x="0" y="0" width="60" height="24" rx="2" fill="#20232a" stroke="#2e323b" stroke-width="1" />
      <text x="12" y="16" fill="#ffffff" font-family="monospace" font-size="11">RPG</text>

      <rect x="70" y="0" width="85" height="24" rx="2" fill="#20232a" stroke="#2e323b" stroke-width="1" />
      <text x="82" y="16" fill="#ffffff" font-family="monospace" font-size="11">Acción</text>

      <rect x="165" y="0" width="115" height="24" rx="2" fill="#20232a" stroke="#2e323b" stroke-width="1" />
      <text x="177" y="16" fill="#ffffff" font-family="monospace" font-size="11">Mundo Abierto</text>

      <rect x="290" y="0" width="160" height="24" rx="2" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899" stroke-width="1" />
      <text x="302" y="16" fill="#ec4899" font-family="monospace" font-weight="bold" font-size="11">PC · PS5 · XBOX</text>
    </g>

    <!-- Synopsis paragraph -->
    <text x="0" y="145" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="14" width="760">
      <tspan x="0" dy="0">Levántate, Sinluz, y déjate guiar por la gracia para esgrimir el poder del Círculo de Elden y</tspan>
      <tspan x="0" dy="22">convertirte en el Señor del Círculo en las Tierras Intermedias. Un juego de rol de acción y fantasía</tspan>
      <tspan x="0" dy="22">creado por Hidetaka Miyazaki y George R. R. Martin con un vasto mundo por explorar.</tspan>
    </text>

    <!-- Screenshot Gallery Strip -->
    <text x="0" y="240" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="14">CAPTURAS DE PANTALLA OFICIALES (IGDB 1080p)</text>
    <g transform="translate(0, 255)">
      <rect x="0" y="0" width="180" height="105" rx="2" fill="#20232a" stroke="#333742" stroke-width="1" />
      <image href="https://images.igdb.com/igdb/image/upload/t_1080p/sc7lqm.jpg" width="180" height="105" preserveAspectRatio="xMidYMid slice" />
      
      <rect x="195" y="0" width="180" height="105" rx="2" fill="#20232a" stroke="#333742" stroke-width="1" />
      <image href="https://images.igdb.com/igdb/image/upload/t_1080p/sc7lqn.jpg" width="180" height="105" preserveAspectRatio="xMidYMid slice" />

      <rect x="390" y="0" width="180" height="105" rx="2" fill="#20232a" stroke="#333742" stroke-width="1" />
      <image href="https://images.igdb.com/igdb/image/upload/t_1080p/sc7lqo.jpg" width="180" height="105" preserveAspectRatio="xMidYMid slice" />

      <rect x="585" y="0" width="180" height="105" rx="2" fill="#20232a" stroke="#333742" stroke-width="1" />
      <image href="https://images.igdb.com/igdb/image/upload/t_1080p/sc7lqp.jpg" width="180" height="105" preserveAspectRatio="xMidYMid slice" />
    </g>
  </g>
</svg>
