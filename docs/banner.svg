<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0E1626" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Ambient Glow Spots -->
    <radialGradient id="glowViolet" cx="30%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPink" cx="75%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Tech Grid -->
    <pattern id="bannerGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1" />
    </pattern>

    <!-- Logo Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="primaryAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>
  </defs>

  <!-- Background Base & Ambient Lights -->
  <rect width="1200" height="340" rx="16" fill="url(#bannerBg)" />
  <rect width="1200" height="340" rx="16" fill="url(#bannerGrid)" />
  <rect width="1200" height="340" rx="16" fill="url(#glowViolet)" />
  <rect width="1200" height="340" rx="16" fill="url(#glowPink)" />

  <!-- Outer Tech Border -->
  <rect x="10" y="10" width="1180" height="320" rx="14" stroke="#6366F1" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Corner Tech Brackets -->
  <path d="M 20 40 L 20 20 L 40 20" stroke="#818CF8" stroke-width="3" stroke-linecap="round" />
  <path d="M 1160 20 L 1180 20 L 1180 40" stroke="#818CF8" stroke-width="3" stroke-linecap="round" />
  <path d="M 20 300 L 20 320 L 40 320" stroke="#818CF8" stroke-width="3" stroke-linecap="round" />
  <path d="M 1160 320 L 1180 320 L 1180 300" stroke="#818CF8" stroke-width="3" stroke-linecap="round" />

  <!-- Top Pill / Badge -->
  <g transform="translate(500, 36)">
    <rect width="200" height="28" rx="14" fill="#1E293B" stroke="#6366F1" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#10B981" />
    <text x="105" y="18.5" fill="#E2E8F0" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="2">NEXT-GEN GAMING HUB</text>
  </g>

  <!-- Centered Logo (width ~439, scaled to 1.15 => ~505px, centered at (1200 - 505)/2 = 347) -->
  <g transform="translate(347, 85) scale(1.15)">
