  </g>

  <!-- Subtitle Tagline -->
  <text x="600" y="235" fill="#CBD5E1" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle" letter-spacing="0.5">
    Control total de tu biblioteca de videojuegos • Ruletas de decisión • Pasaporte Gamer
  </text>

  <!-- Feature Tags Row -->
  <g transform="translate(305, 268)">
    <!-- Tag 1: IGDB API -->
    <rect x="0" y="0" width="130" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="65" y="20.5" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🎮 IGDB API v4</text>

    <!-- Tag 2: 3 Roulette Modes -->
    <rect x="145" y="0" width="160" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="225" y="20.5" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🎲 3 Modos de Ruleta</text>

    <!-- Tag 3: Drag & Drop -->
    <rect x="320" y="0" width="130" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="385" y="20.5" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Drag &amp; Drop</text>

    <!-- Tag 4: Gamer Passport -->
    <rect x="465" y="0" width="125" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="527" y="20.5" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🛡️ Gamer Passport</text>
  </g>
</svg>